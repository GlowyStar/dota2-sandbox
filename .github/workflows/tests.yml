name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit, engine and environment tests
        run: node tests/run.mjs
      - name: Random fights (no script errors)
        run: node tools/fuzz.mjs --n 5000 --seed 1 --workers 2
      - name: Live-game comparison from the stored recordings (report only)
        run: node tools/live/compare_all.mjs --quiet
